<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- the chosen theme before the first paint (workbench.js keeps it in sync) -->
    <script>
      try {
        const theme = localStorage.getItem("inter-math-workbench.theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Inter Math overlay</title>
  </head>
  <body>
    <header>
      <h1>Overlay</h1>
      <nav><a href="./specimens.html">Specimens</a><a href="./symbols.html">Symbols</a><a href="./review.html">Review</a><a href="./overlay.html">Overlay</a><a href="./mathml.html">OpenType</a></nav>
      <span class="note">Inter Math's math (blue) laid over Inter's own text (red) at every weight: where both meet the ink is dark, where they differ the colours show</span>
      <span class="spacer"></span>
    </header>
    <main>
      <table class="overlay">
        <colgroup><col class="point" /><col /><col /><col /><col /><col /><col /><col /><col /><col /></colgroup>
        <thead>
          <tr>
            <th>Math over text</th>
            <th>100</th>
            <th>200</th>
            <th>300</th>
            <th>400</th>
            <th>500</th>
            <th>600</th>
            <th>700</th>
            <th>800</th>
            <th>900</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
