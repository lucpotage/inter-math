<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inter Math with KaTeX</title>
    <!--
      The npm package as `pnpm dist` builds it (dist/npm/). From a CDN, the same files are at
      https://cdn.jsdelivr.net/npm/inter-math@<version>/ (katex.min.css, lib/katex.js, lib/index.js).
    -->
    <link rel="stylesheet" href="../dist/npm/katex.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" />
    <style>
      body { margin: 0 auto; padding: 32px 16px; max-width: 760px; font: 18px/1.5 Inter, system-ui, sans-serif; color: #111; background: #fff; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      code { font-size: 15px; }
      label { display: block; margin: 16px 0; font-size: 15px; }
      ol { padding-left: 24px; }
      li { margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1>Inter Math with KaTeX</h1>
    <p>
      KaTeX with Inter Math's hooks (the package's own KaTeX), its stylesheet and the
      <code>inter-math</code> class on the math's container. Inline math sits in Inter's text,
      such as <span class="math" data-tex="e^{i\pi} + 1 = 0"></span> or
      <span class="math" data-tex="a^2 + b^2 = c^2"></span>, at the text's weight.
    </p>
    <label>Weight <input id="weight" type="range" min="100" max="900" step="10" value="400" /> <output id="value">400</output></label>
    <ol id="formulas"></ol>

    <script type="module">
      import katex from "../dist/npm/lib/katex.js";
      import { setMathFont } from "../dist/npm/lib/index.js";

      const FORMULAS = [
        String.raw`x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}`,
        String.raw`\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}`,
        String.raw`\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}`,
        String.raw`\lim_{n \to \infty} \left(1 + \frac{1}{n}\right)^{n} = e`,
        String.raw`A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}, \quad \det A = ad - bc`,
        String.raw`\left| x \right| = \begin{cases} x & \text{if } x \ge 0 \\ -x & \text{otherwise} \end{cases}`,
        String.raw`\hat{x},\; \tilde{a},\; \vec{v},\; \overline{AB},\; \widehat{xyz},\; \mathbb{R},\; \mathbf{F} = m\mathbf{a}`,
        String.raw`\left\{ \frac{\frac{a}{b}}{c} \right\} \quad \overbrace{a + b + c}^{n} \quad A \xrightarrow{f} B \quad \sqrt[3]{x^3 + y^3}`,
      ];

      // the whole page is Inter Math's: the class on any ancestor of the math switches KaTeX's fonts
      document.body.classList.add("inter-math");
      const list = document.querySelector("#formulas");
      list.innerHTML = FORMULAS.map(() => "<li></li>").join("");

      function render(weight) {
        // KaTeX lays the math out with the metrics of the weight it is set at; the CSS draws it at the same weight
        setMathFont("inter", { weight });
        document.body.style.setProperty("--inter-math-weight", String(weight));
        document.body.style.fontWeight = String(weight);
        FORMULAS.forEach((tex, i) => katex.render(tex, list.children[i], { displayMode: true, throwOnError: false }));
        for (const el of document.querySelectorAll(".math")) katex.render(el.dataset.tex, el, { throwOnError: false });
      }

      const slider = document.querySelector("#weight");
      slider.addEventListener("input", () => {
        document.querySelector("#value").value = slider.value;
        render(Number(slider.value));
      });
      render(Number(slider.value));
    </script>
  </body>
</html>
